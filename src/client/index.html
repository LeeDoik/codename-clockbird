           또렷하게 떠서 눈이 그리로 간다. 밝기와 채도를 같이 눌러야 배경이 된다. */
        opacity: 0.2;
        filter: brightness(0.45) saturate(0.5);
        animation: tr-cog 24s linear infinite;
      }
      @keyframes tr-cog { to { transform: rotate(360deg); } }

      /* 흐르는 천공 테이프 (public/ui/tape-strip.png, 320×56).
         장식이 아니라 **부제를 그림으로 옮긴 것**이다 — 이 화면이 떠 있는 동안
         뜨는 말이 "동료들의 암호를 수신하고 있다"다. 테이프가 지나가야 수신이다.

         좌우 끝이 이어지도록 구운 그림이라 `repeat-x` 로 깔고 배경 위치만 민다.
         한 장 너비(320)만큼 밀면 원위치라 이음매 없이 무한히 흐른다. */
      #transition::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(72 * var(--s));
        height: calc(40 * var(--s));
        background: url('/ui/tape-strip.png') 0 center / auto calc(40 * var(--s)) repeat-x;
        image-rendering: pixelated;
        /* 종이가 크림색이라 0.5 로는 화면을 가로지르는 흰 띠가 된다 — 배경이 아니라
           주인공이 되어 버린다. 시계보다 뒤에 있어야 하므로 더 눌러 둔다. */
        opacity: 0.26;
        animation: tr-tape 2.6s linear infinite;
      }
      @keyframes tr-tape { to { background-position-x: calc(-320 * var(--s)); } }

      /* 회중시계 (public/ui/watch-face.png, 170×221 · PixelLab).
         태엽새의 시계 모티프. 두 바늘이 다른 속도로 돈다 — "멈춘 게 아니라 돌아가는
         중"을 그림 하나로 말하는 자리다.

         ⚠ 바늘은 CSS 로 남는다. 돌아야 하니 그림에 구울 수 없다.
         ⚠ 축이 그림 한가운데가 아니다. 위쪽에 용두와 고리가 얹혀 있어 문자판이
           아래로 밀려 있다 — 실측 좌 50.3% · 상 56.1%. 50% 로 두면 바늘이 문자판
           위쪽에 박혀 돌아간다.

           재는 법: 문자판을 가로지르는 **가장 긴 어두운 구간**을 찾는다. 그 줄이
           원의 중심 높이고 구간의 한가운데가 중심 가로 위치다. 어두운 픽셀의
           무게중심으로 재면 안 된다 — 테두리 그늘과 용두 그림자가 아래로 끌어당겨
           3.5% 어긋난 값이 나왔다(59.6% vs 실제 56.1%). 시계를 다시 구우면 다시 재라. */
      #transition-clock {
        position: relative;
        /* 170:221 — 그림 비율 그대로다. 어긋나면 `contain` 이 여백을 만들어
           바늘 축(백분율)이 그림의 축과 어긋난다. */
        width: calc(216 * var(--s));
        height: calc(281 * var(--s));
        background: url('/ui/watch-face.png') center / contain no-repeat;
        image-rendering: pixelated;
        filter: drop-shadow(0 calc(6 * var(--s)) calc(16 * var(--s)) rgba(0, 0, 0, 0.8));
      }
      #transition-clock::before,
      #transition-clock::after {
        content: '';
        position: absolute;
        left: 50.3%;
        top: 56.1%;
        width: calc(3 * var(--s));
        transform-origin: 50% 100%;
        background: var(--brass);
        border-radius: calc(1.5 * var(--s));
      }
      /* 분침(길고 밝다)은 1.8초에 한 바퀴 — 로딩 스피너의 박자. 시침은 그 1/6.
         ⚠ translate 로 축을 잡고 rotate 가 그 뒤에 온다. 순서가 바뀌면 바늘이
           제자리에서 도는 대신 축을 중심으로 원을 그리며 날아다닌다. */
      #transition-clock::before {
        height: calc(74 * var(--s));
        background: var(--brass-hi);
        animation: tr-spin 1.8s linear infinite;
      }
      #transition-clock::after {
        height: calc(48 * var(--s));
        animation: tr-spin 10.8s linear infinite;
      }
      @keyframes tr-spin {
        from { transform: translate(-50%, -100%) rotate(0deg); }
        to { transform: translate(-50%, -100%) rotate(360deg); }
      }
      #transition-title {
        font-family: var(--font-head);
        font-size: calc(34 * var(--s));
        letter-spacing: 0.14em;
        color: var(--paper);
      }
      /* 말줄임 세 점이 차례로 깜빡인다 — 시계와 함께 "진행 중"을 만드는 두 번째 움직임 */
      #transition-title .tr-dot { animation: tr-dot 1.4s infinite; }
      #transition-title .tr-dot:nth-child(2) { animation-delay: 0.35s; }
      #transition-title .tr-dot:nth-child(3) { animation-delay: 0.7s; }
      @keyframes tr-dot { 0%, 100% { opacity: 0.15; } 45% { opacity: 1; } }
      #transition-sub { font-size: calc(20 * var(--s)); color: var(--paper-dim); letter-spacing: 0.06em; }
    </style>
  </head>
  <body>
    <header>코드네임: 태엽새</header>
    <div id="game-root">
      <div id="game-canvas"></div>
      <!-- 화면 고정 HUD. 대화창·패널보다 앞에 적어 두면 그것들이 위를 덮는다. -->
      <div id="hud">
        <div id="hud-status"></div>
        <div id="hud-room"></div>
        <div id="hud-keys"></div>
      </div>
      <!-- 단서 수첩([C]). #hud 보다 뒤(= 위)에, 대화창보다 앞(= 아래)에 적는다 —
           캔버스 시절에도 수첩은 UI 카메라에 그려졌고 대화창은 캔버스 전체를 덮는
           DOM 이라 그보다 위였다. 그 겹침 순서를 그대로 옮긴 자리다. -->
      <div id="cluebook">
        <div id="cluebook-card">
          <div id="cluebook-title">단서 수첩</div>
          <div id="cluebook-body"></div>
          <div id="cluebook-hint">[C] 닫기</div>
        </div>
      </div>
      <!-- 오프닝 영상. 파일이 없으면 IntroScene 이 패널 오프닝으로 돌아간다. -->
      <div id="intro-video">
        <video id="intro-video-el" playsinline preload="auto"></video>
        <div id="intro-skip">[Space / Esc / 클릭] 건너뛰기</div>
        <button id="intro-unmute">🔇 소리 켜기</button>
      </div>
      <!-- 초상은 패널 배경보다 앞에 와야 하므로 #dialogue 의 자식이다.
           누를 것(선택지·대화·코드·닫기)은 전부 #dialogue-actions 한 줄에 모여 패널 위로
           떠 있다 — 글 옆에 두면 본문 폭을 잘라먹는다. 대화·코드 버튼은 입력창이 열릴
           때만 보인다 (DialogueBox 가 style.display 로 토글).
           안내 문구(#dialogue-hint)는 그 버튼들이 비운 패널 오른쪽 아래로 내려갔다. -->
      <div id="dialogue" class="no-portrait">
        <img id="dialogue-portrait" alt="" />
        <div id="dialogue-speaker"></div>
        <div id="dialogue-actions">
          <div id="dialogue-choices"></div>
          <button id="dialogue-send" class="dlg-btn" style="display: none">대화 <span class="key">Enter</span></button>
          <button id="dialogue-code" class="dlg-btn" style="display: none">접선 코드 전달 <span class="key">F</span></button>
          <button id="dialogue-close" class="dlg-btn">닫기 <span class="key">Esc</span></button>
        </div>
        <div id="dialogue-text"></div>
        <div id="dialogue-more">▼</div>
        <div id="dialogue-measure"></div>
        <div id="dialogue-input">
          <input id="dialogue-field" type="text" placeholder="말을 건넨다..." autocomplete="off" />
        </div>
        <div id="dialogue-hint"></div>
      </div>
      <div id="minigame">
        <div id="minigame-card" class="sp-panel">
          <!-- head 는 기본 배치에서 display:contents 라 없는 것과 같다.
               stage 배치(수류탄 투척)에서만 제목·부제를 한 액자에 묶는다. -->
          <div id="minigame-head">
            <div id="minigame-title"></div>
            <div id="minigame-subtitle"></div>
          </div>
          <div id="minigame-timer">
            <div id="minigame-timer-fill"></div>
            <span id="minigame-clock"></span>
          </div>
          <div id="minigame-content"></div>
          <div id="minigame-hint"></div>
          <div id="minigame-verdict"></div>
        </div>
      </div>
      <div id="docpanel">
        <div id="docpanel-paper">
          <div id="docpanel-title"></div>
          <div id="docpanel-body"></div>
          <div id="docpanel-hint">[Space] / [Esc] 로 덮는다</div>
        </div>
      </div>
      <div id="result">
        <div id="result-card" class="sp-panel">
          <div id="result-title"></div>
          <div id="result-line"></div>
          <div id="result-code"></div>
          <div id="result-stats"></div>
          <button id="result-restart" class="sp-btn">다시 잠입한다</button>
          <div id="result-wait"></div>
        </div>
      </div>
      <!-- 타이틀 화면 (ui/TitleScreen.js). 메뉴 버튼은 JS 가 #title-menu 에 심는다.
           로딩 화면·베젤보다 앞(= 아래)이라 그 둘만 이 위에 올 수 있다. -->
      <div id="title">
        <img id="title-bg" src="/title/title-city.png" alt="" onerror="this.style.display='none'" />
        <div id="title-fx"></div>
        <div id="title-panel">
          <div id="title-codename">CODENAME</div>
          <div id="title-name">태엽새</div>
          <div id="title-sub">HEART OF STEEL</div>
          <div id="title-bars"><i></i><i></i><i></i><i></i></div>
          <div id="title-quote">“강철은 인간의 마음을 이해할 수 없다”</div>
          <div id="title-menu"></div>
          <div id="title-hint"></div>
        </div>
      </div>
      <!-- 씬 전환 로딩 — 맨 끝(= 맨 위)이라 위의 모든 창을 덮는다 (ui/TransitionScreen.js) -->
      <div id="transition">
        <div id="transition-clock"></div>
        <div id="transition-title"></div>
        <div id="transition-sub"></div>
      </div>
      <!-- 화면 테두리 — 맨 끝이라 로딩 화면까지 포함해 모든 것 위에 온다.
           게임 안의 창이 아니라 화면을 담은 기계의 앞판이다. -->
      <div id="screen-frame"></div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
