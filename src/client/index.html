<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>코드네임: 태엽새</title>
    <style>
      :root {
        --brass: #c9a227;
        --ink: #1a1712;
        --paper: #e8dcc0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--ink);
        color: var(--paper);
        font-family: 'Malgun Gothic', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }
      /* 캔버스 표시 크기 — 창에 들어가는 최대 14:9(896:576) 박스.
         내부 해상도는 main.js 가 896×576 으로 고정하고, Phaser FIT 모드가 이 박스를 채운다.
         (100vh - 72px) 는 상단 헤더 몫을 뺀 세로 여유. */
      #game-root {
        position: relative;
        width: min(100vw - 32px, calc((100vh - 72px) * 896 / 576));
        aspect-ratio: 896 / 576;
      }
      #game-canvas { width: 100%; height: 100%; }
      /* 픽셀 아트 확대가 흐릿해지지 않게 — CSS 업스케일 단계의 보간을 끈다 */
      #game-canvas canvas { display: block; image-rendering: pixelated; }

      /* 대화창은 DOM 오버레이 — 한글 입력과 스트리밍 표시에 유리하다. */
      #dialogue {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 16px;
        background: rgba(26, 23, 18, 0.94);
        border: 2px solid var(--brass);
        border-radius: 4px;
        padding: 14px 18px;
        display: none;
        z-index: 10;
      }
      #dialogue.visible { display: block; }
      /* NPC 컷인 — 배경 제거된 일러스트를 대화창 위, 화면 왼쪽에 크게 세운다
         (작은 썸네일이 아니라 캐릭터가 게임 화면에 걸쳐 서 있는 느낌). */
      #dialogue-portrait {
        display: none;
        position: absolute;
        left: 3%;
        bottom: 10%;
        height: 80%;
        width: auto;
        z-index: 5;
        pointer-events: none;
        filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.55));
      }
      #dialogue-portrait.visible { display: block; }
      #dialogue-speaker { color: var(--brass); font-weight: 700; margin-bottom: 6px; }
      #dialogue-text { line-height: 1.6; min-height: 3em; white-space: pre-wrap; }
      #dialogue-hint { opacity: 0.5; font-size: 0.8rem; margin-top: 8px; }
      /* 선택지 — 대화창 안이 아니라, 화면 우측에 세로 메뉴로 따로 뜬다 (레퍼런스 참고). */
      #dialogue-choices {
        display: none;
        position: absolute;
        right: 16px;
        bottom: 150px;
        width: 200px;
        flex-direction: column;
        gap: 8px;
        z-index: 8;
      }
      #dialogue-choices.visible { display: flex; }
      #dialogue-choices button {
        border: 2px solid var(--brass);
        border-radius: 6px;
        padding: 10px 14px;
        cursor: pointer;
        font-family: inherit;
        font-weight: 700;
        text-align: left;
        background: rgba(26, 23, 18, 0.94);
        color: var(--paper);
      }
      #dialogue-choices button:hover { background: var(--brass); color: var(--ink); }
      #dialogue-input { display: none; margin-top: 10px; gap: 8px; }
      #dialogue-input.visible { display: flex; }
      #dialogue-input input {
        flex: 1;
        background: #0f0d0a;
        border: 1px solid var(--brass);
        color: var(--paper);
        padding: 8px 10px;
        border-radius: 3px;
        font-family: inherit;
        font-size: 1rem;
      }
      #dialogue-input input:disabled { opacity: 0.4; }
      #dialogue-input button {
        border: 0;
        font-weight: 700;
        padding: 8px 14px;
        border-radius: 3px;
        cursor: pointer;
        font-family: inherit;
        white-space: nowrap;
      }
      #dialogue-input button:disabled { opacity: 0.35; cursor: default; }
      #dialogue-send { background: #4a7a6b; color: var(--paper); }
      /* 코드 전달은 되돌릴 수 없고 신뢰도를 깎는다 — 색으로 무게를 준다. */
      #dialogue-code { background: var(--brass); color: var(--ink); }
      header { padding: 12px; opacity: 0.55; font-size: 0.85rem; letter-spacing: 0.05em; }
    </style>
  </head>
  <body>
    <header>코드네임: 태엽새 — 개발 스켈레톤 (W1)</header>
    <div id="game-root">
      <div id="game-canvas"></div>
      <img id="dialogue-portrait" alt="" />
      <div id="dialogue-choices"></div>
      <div id="dialogue">
        <div id="dialogue-speaker"></div>
        <div id="dialogue-text"></div>
        <div id="dialogue-input">
          <input id="dialogue-field" type="text" placeholder="말을 건넨다..." autocomplete="off" />
          <button id="dialogue-send">대화</button>
          <button id="dialogue-code">접선 코드 전달</button>
        </div>
        <div id="dialogue-hint">[Enter] 대화 · [Esc] 닫기</div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
