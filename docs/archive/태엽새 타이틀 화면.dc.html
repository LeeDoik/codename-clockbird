<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin" />
<link href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" rel="stylesheet" />
<style>
  :root{
    --brass-hi:#e8c15a; --brass:#c9a227; --brass-lo:#7a5f1a;
    --leather:#2c2018; --ink:#1a1712; --paper:#e8dcc0; --paper-dim:#8a7f6a;
    --patina:#5e8b7e; --wax:#a03325;
    --font-pixel:'Galmuri11','Galmuri9','Galmuri14',monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#0b0805;color:var(--paper);font-family:var(--font-pixel);overflow:hidden}
  a{color:var(--brass);text-decoration:none} a:hover{color:var(--brass-hi)}
  button{font-family:inherit}
  @keyframes tw-blink{0%,45%{opacity:1}55%,100%{opacity:.05}}
</style>
</helmet>

<template id="__bundler_thumbnail" data-bg-color="#1a1712">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#1a1712" />
    <rect x="360" y="240" width="480" height="320" fill="#2c2018" />
    <text x="600" y="440" text-anchor="middle" font-family="monospace" font-size="180" fill="#e8c15a">태엽</text>
    <rect x="440" y="500" width="120" height="16" fill="#c9a227" />
    <rect x="576" y="500" width="60" height="16" fill="#7a5f1a" />
  </svg>
</template>

<div style="width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0805">
  <div ref="{{ stageRef }}" style="position:relative;width:1920px;height:1080px;flex:none;transform-origin:center center;overflow:hidden;font-family:var(--font-pixel);background:linear-gradient(180deg,var(--ink) 0%,var(--leather) 58%,var(--ink) 100%)">

    <div style="position:absolute;inset:0;background-image:url('assets/title-city.png');background-size:cover;background-position:56% bottom;background-repeat:no-repeat;image-rendering:pixelated"></div>

    <div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.72) 22%,rgba(0,0,0,.34) 42%,rgba(0,0,0,.08) 56%,transparent 68%)"></div>
    <div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.42) 0%,transparent 26%,transparent 74%,rgba(0,0,0,.5) 100%)"></div>
    <div style="position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(0,0,0,.3) 0 2px,transparent 2px 5px)"></div>
    <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 46% 40%,transparent 54%,rgba(0,0,0,.5) 100%)"></div>

    <div style="position:absolute;left:110px;top:50%;transform:translateY(-50%);z-index:1">
      <div style="display:inline-block;font-size:20px;letter-spacing:.34em;color:var(--ink);background:var(--brass-lo);padding:6px 12px 4px">CODENAME</div>
      <div style="font-size:146px;line-height:1.04;letter-spacing:.03em;color:var(--brass-hi);margin-top:12px;text-shadow:5px 5px 0 var(--brass),10px 10px 0 var(--brass-lo),15px 15px 0 var(--ink)">태엽새</div>
      <div style="font-size:28px;letter-spacing:.4em;color:var(--paper-dim);margin-top:22px">HEART OF STEEL</div>
      <div style="display:flex;gap:6px;margin:24px 0 4px">
        <div style="width:56px;height:8px;background:var(--brass)"></div>
        <div style="width:28px;height:8px;background:var(--brass-lo)"></div>
        <div style="width:14px;height:8px;background:var(--brass-lo);opacity:.6"></div>
        <div style="width:8px;height:8px;background:var(--brass-lo);opacity:.35"></div>
      </div>
      <div style="display:inline-block;font-size:21px;letter-spacing:.1em;color:var(--paper-dim);margin-bottom:26px;background:rgba(10,8,5,.82);padding:8px 14px 6px">“강철은 인간의 마음을 이해할 수 없다”</div>
      <div style="display:flex;flex-direction:column;align-items:flex-start;gap:8px">
        <sc-for list="{{ menu }}" as="m" hint-placeholder-count="3">
          <button onClick="{{ m.pick }}" onMouseEnter="{{ m.enter }}" style="display:flex;align-items:center;gap:14px;font-size:34px;letter-spacing:.1em;border:none;padding:10px 26px 8px 16px;cursor:pointer;background:{{ m.bg }};color:{{ m.fg }};box-shadow:{{ m.bevel }}">
            <span style="animation:{{ m.cursorAnim }};opacity:{{ m.cursorOp }}">▶</span>{{ m.label }}
          </button>
        </sc-for>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = { sel: 0 };
  items = [
    { key:'start', label:'게임 시작' },
    { key:'intro', label:'인트로 다시보기' },
    { key:'quit',  label:'게임 종료' }
  ];

  componentDidMount() {
    this.fit = () => {
      if (!this.stage) return;
      const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      this.stage.style.transform = 'scale(' + s + ')';
    };
    this.fit();
    window.addEventListener('resize', this.fit);
    this.onKey = e => {
      const n = this.items.length;
      if (e.key === 'ArrowDown' || e.key === 's') { this.setState(st => ({ sel:(st.sel + 1) % n })); e.preventDefault(); }
      else if (e.key === 'ArrowUp' || e.key === 'w') { this.setState(st => ({ sel:(st.sel + n - 1) % n })); e.preventDefault(); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); }
    };
    window.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.fit);
    window.removeEventListener('keydown', this.onKey);
  }

  renderVals() {
    const sel = this.state.sel;
    return {
      stageRef: el => { this.stage = el; this.fit && this.fit(); },
      menu: this.items.map((it, i) => {
        const on = i === sel;
        const danger = it.key === 'quit';
        return {
          label: it.label,
          bg: on ? (danger ? 'var(--wax)' : 'var(--brass)') : 'transparent',
          fg: on ? 'var(--ink)' : danger ? 'var(--wax)' : 'var(--paper-dim)',
          bevel: on && !danger ? 'inset 5px 5px 0 0 var(--brass-hi),inset -5px -5px 0 0 var(--brass-lo)' : 'none',
          cursorAnim: on ? 'tw-blink .8s steps(1) infinite' : 'none',
          cursorOp: on ? 1 : .3,
          enter: () => this.setState({ sel:i }),
          pick: () => this.setState({ sel:i })
        };
      })
    };
  }
}

</script>
</body>
</html>
